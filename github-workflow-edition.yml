# Broadsheet edition compiler -- GitHub Actions workflow.
#
# LIVE in the public repo dankelleghan-ops/broadsheet-editions as .github/workflows/edition.yml
# (this file is the canonical copy; the editions repo also keeps a root copy,
# github-workflow-edition.yml, and all three must stay identical). BASE_URL below is that
# repo's real GitHub Pages URL, and Pages serves the gh-pages branch.
#
# Shape: compile the edition (steady-state runs are cheap -- the cached state file makes most
# feed fetches 304s and retained articles cost zero fetches), then force-push the output
# directory to gh-pages as a single orphan commit (history stays one commit deep; Pages
# serves edition.json.gz + images/).
#
# SELF-CHAINING (why it does not just trust `schedule`)
# GitHub's free cron scheduler is best-effort and, measured 2026-10-11 over 7 days, delivered
# only ~4.4 runs a day (median gap 5.6 h, worst 9.3 h) against the requested every-30-minutes.
# The app treats a bundle older than 90 minutes as stale and falls back to a slow crawl, so
# the schedule alone left the app on the slow path most of the day. So the run re-arms itself:
#
#   1. `compile` builds and publishes (about 2 minutes).
#   2. `rearm` needs `compile` and declares `environment: edition-rearm`. That environment has
#      a 20-minute WAIT TIMER protection rule (repo Settings > Environments). A job held by a
#      wait timer is "waiting", not running: it holds no runner, so the wait is free.
#   3. When the timer elapses, `rearm` dispatches the next run of this same workflow with the
#      built-in token. workflow_dispatch is one of the two events GITHUB_TOKEN is allowed to
#      trigger (the other is repository_dispatch). No PAT, no new secret, no external service.
#   Result: one run about every 22-23 minutes (2 compile + 20 wait + queue time), nonstop.
#
#   - `schedule` stays as a WATCHDOG. If the chain ever breaks (dispatch failed all retries,
#     a run was cancelled, the workflow was off for a while), the next cron delivery restarts
#     it. The cron minutes (13 and 43) are deliberately off the congested :00 / :30 marks.
#   - Chains never multiply. The workflow-level `concurrency` group below allows one run
#     (a run that is waiting on the timer still counts as running) plus at most ONE pending
#     run; a newer pending run replaces the older. So a watchdog or manual run that arrives
#     mid-chain just queues behind it. `rearm` also looks for such a queued run and, if one
#     exists, skips its own dispatch and lets that run be the next link (it re-arms in turn).
#   - If the dispatch is skipped or fails, the watchdog and a manual run are the recovery.
#
# RESTART BY HAND:   gh workflow run edition.yml --repo dankelleghan-ops/broadsheet-editions
# SWITCH OFF:        disable the workflow (gh workflow disable edition.yml --repo ...; a run
#                    already waiting notices on wake-up and does not dispatch), or remove the
#                    `rearm` job below to go back to cron-only. Cancelling the in-flight run
#                    also stops the chain until the next watchdog delivery.
# TUNE THE CADENCE:  change the wait timer on the edition-rearm environment (no code change):
#                    gh api -X PUT repos/dankelleghan-ops/broadsheet-editions/environments/edition-rearm -F wait_timer=<minutes>
#
# Pages rebuilds on every gh-pages push; at ~2.6 pushes an hour this stays well under
# GitHub Pages' soft limit of 10 builds per hour. Do not shorten the timer below ~7 minutes.

name: Compile edition

on:
  schedule:
    # Watchdog only (see SELF-CHAINING above). :13 and :43 avoid the top-of-hour and
    # half-hour marks where GitHub's scheduler is most congested.
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

# Overlapping runs must never double-push gh-pages, and a second chain must never form. One
# run in the group at a time (a run waiting on the rearm timer still holds it); at most one
# pending run behind it. Never cancel a mid-push run; let the newer one wait.
concurrency:
  group: compile-edition
  cancel-in-progress: false

permissions:
  contents: write  # gh-pages force-push

env:
  # The real GitHub Pages URL of this repo (https://<user>.github.io/<repo>).
  BASE_URL: "https://dankelleghan-ops.github.io/broadsheet-editions"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) because this job holds a
      # contents:write token -- a hijacked tag would otherwise run attacker code with push
      # access to this repo. Tag -> SHA mappings recorded above each `uses:`; verified via
      # the GitHub API at pin time (2026-08-05).

      # actions/checkout v4 (v4.4.0) -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # swift-actions/setup-swift v2 (v2.4.0) -> 7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
      # (the v2 ref is an annotated tag; this is the commit it dereferences to)
      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0"

      - name: Install ImageMagick
        # ubuntu-latest (24.04) images no longer preinstall ImageMagick -- proven by the first
        # live run failing exactly here. ~20s, cached apt lists make reruns faster.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Verify ImageMagick is present
        run: command -v magick || command -v convert

      # The state file (feed conditionals + compiled articles + rejection cache) and the
      # output directory (images survive between runs) both persist via the cache. A cache
      # miss is never fatal -- the run is just more expensive once (retained articles'
      # images re-download from their recorded source URLs).
      # actions/cache v4 (v4.3.0) -> 0057852bfaa89a56745cba8c7296529d2fc39830
      - name: Restore compiler state and output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            state/edition-state.json
            out
          key: edition-state-${{ github.run_id }}
          restore-keys: |
            edition-state-

      # actions/cache v4 (v4.3.0) -> 0057852bfaa89a56745cba8c7296529d2fc39830
      - name: Build compiler cache (SwiftPM)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Compile edition
        run: |
          mkdir -p state out
          swift run -c release compile-edition \
            --out out \
            --state state/edition-state.json \
            --base-url "$BASE_URL"

      - name: Publish to gh-pages (single force-pushed commit)
        run: |
          set -euo pipefail

          # The git metadata lives OUTSIDE out/, via GIT_DIR/GIT_WORK_TREE. Previously
          # `git init` ran inside out/ itself and the step ended with `rm -rf .git` to keep
          # the repo out of the cached `out` path -- on 2026-08-22 (run 32569673396) that rm
          # failed with "Directory not empty" and, under `set -e`, failed the whole job AFTER
          # the gh-pages push had already succeeded. The likeliest writer racing the rm is
          # git's own detached auto-gc (gc.auto defaults on at 6700 loose objects, and every
          # run commits the WHOLE out/ tree as a fresh orphan, so the threshold is reachable)
          # still repacking .git/objects while rm walked it.
          #
          # Keeping .git out of out/ entirely removes the hazard by construction rather than
          # papering over it: there is nothing inside the cached directory left to clean up,
          # so no cleanup step can fail the run.
          WORK_TREE="$(pwd)/out"
          export GIT_DIR="$RUNNER_TEMP/edition-gitdir"
          export GIT_WORK_TREE="$WORK_TREE"
          rm -rf "$GIT_DIR"

          # Pages must serve the .gz as-is; .nojekyll skips Jekyll processing entirely.
          touch "$WORK_TREE/.nojekyll"

          git init -b gh-pages
          git config user.name "broadsheet-edition-bot"
          git config user.email "actions@users.noreply.github.com"
          # Belt and braces: nothing should trigger gc in a single-commit throwaway repo, and
          # it can no longer hurt us if it does.
          git config gc.auto 0

          git add -A
          # --allow-empty: a fresh orphan init always has something to commit (.nojekyll at
          # minimum), but never let a someday-empty diff kill the job under `set -e`.
          git commit -m "edition $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty

          # Retry the push: a single HTTP 408 from github.com failed a run on 2026-09-29. A
          # forced push of the same orphan commit is idempotent, so retrying is always safe.
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          pushed=0
          for attempt in 1 2 3; do
            if git push --force "$REMOTE" gh-pages; then
              pushed=1
              break
            fi
            echo "::warning::git push to gh-pages failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::git push to gh-pages failed after 3 attempts"
            exit 1
          fi

          # $RUNNER_TEMP is discarded with the VM anyway -- tidiness only, and it must never
          # be able to fail the job.
          rm -rf "$GIT_DIR" || true

  # Re-arm: wait out the environment's 20-minute timer, then dispatch the next run. See
  # SELF-CHAINING at the top of this file. Runs whether compile succeeded or failed (a bad
  # run must not end the chain) but NOT when the run was cancelled, so cancelling the
  # in-flight run is a way to stop the chain. (`always()` would re-dispatch even after a
  # cancel.)
  rearm:
    needs: compile
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the wait itself is not counted: a waiting job holds no runner
    environment: edition-rearm  # 20-minute wait timer lives here (repo Settings > Environments)
    permissions:
      actions: write  # dispatch the next run; re-enable the workflow if GitHub idled it
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW_FILE: edition.yml
      CHAIN_REF: main
    steps:
      - name: Re-arm (dispatch the next run)
        run: |
          set -uo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE"

          # 1. Is the workflow switched on? "disabled_manually" is the owner's off switch:
          #    honor it and end the chain. "disabled_inactivity" means GitHub idled it after
          #    60 days without repository activity: turn it back on.
          state="$(gh api "$api" --jq .state 2>/dev/null || echo unknown)"
          echo "workflow state: $state"
          case "$state" in
            disabled_manually)
              echo "Workflow was disabled by hand; not re-arming."
              exit 0
              ;;
            disabled_inactivity)
              echo "::warning::GitHub had disabled this workflow for inactivity; re-enabling."
              gh api -X PUT "$api/enable" || echo "::warning::re-enable call failed"
              ;;
            active)
              # Keep-alive. GitHub's docs say public repos' scheduled workflows are disabled
              # after 60 days with no "repository activity" but do not say what counts, nor
              # that re-enabling resets the clock. This idempotent call (a no-op on an active
              # workflow) is a best-effort nudge, NOT a proven guarantee. Never fatal.
              gh api -X PUT "$api/enable" >/dev/null 2>&1 \
                || echo "::warning::keep-alive enable call failed (ignored)"
              ;;
          esac

          # 2. Single-chain guard. The concurrency group already allows only this run plus
          #    one pending run, but if another run is already queued behind us (a watchdog or
          #    manual run), it becomes the next link and re-arms in turn: dispatching a
          #    second one would only cancel it. Ignore runs older than 3 hours so a stuck
          #    ghost can never block the chain forever. If the lookup fails, dispatch anyway.
          others="$(gh run list --workflow "$WORKFLOW_FILE" --limit 50 \
              --json databaseId,status,createdAt \
              --jq '[.[] | select(.databaseId != '"$GITHUB_RUN_ID"')
                          | select(.status != "completed")
                          | select((.createdAt | fromdateiso8601) > (now - 10800))] | length' \
              2>/dev/null || echo 0)"
          echo "other queued/active runs of this workflow: $others"
          if [ "$others" -gt 0 ]; then
            echo "Another run is already queued; it will carry the chain. Not dispatching."
            exit 0
          fi

          # 3. Dispatch the next run, with backoff (GITHUB_TOKEN may trigger workflow_dispatch).
          for attempt in 1 2 3 4; do
            if gh workflow run "$WORKFLOW_FILE" --ref "$CHAIN_REF"; then
              echo "Dispatched the next run (attempt $attempt)."
              exit 0
            fi
            echo "::warning::dispatch failed (attempt $attempt of 4)"
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * attempt * 5))
            fi
          done
          echo "::error::could not dispatch the next run; the schedule watchdog will restart the chain"
          exit 1
