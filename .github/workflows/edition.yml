# Broadsheet edition compiler -- GitHub Actions workflow.
#
# NOT INSTALLED in this repo (deliberately: this phase is local-only). The publish phase
# copies this file to .github/workflows/edition.yml in the PUBLIC edition repo, sets
# BASE_URL to that repo's real GitHub Pages URL, and enables Pages on the gh-pages branch.
#
# Shape: every 30 minutes, compile the edition (steady-state runs are cheap -- the cached
# state file makes most feed fetches 304s and retained articles cost zero fetches), then
# force-push the output directory to gh-pages as a single orphan commit (history stays one
# commit deep; Pages serves edition.json.gz + images/).

name: Compile edition

on:
  schedule:
    # Every 30 minutes. GitHub cron is best-effort; occasional skipped/late runs are fine --
    # the next run always compiles the full 48h window from scratch-plus-cache.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Overlapping runs must never double-push gh-pages. Never cancel a mid-push run; let the
# newer one wait.
concurrency:
  group: compile-edition
  cancel-in-progress: false

permissions:
  contents: write  # gh-pages force-push

env:
  # The publish phase sets this to the real Pages URL, e.g.
  # https://<user>.github.io/<repo>
  BASE_URL: "https://dankelleghan-ops.github.io/broadsheet-editions"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) because this job holds a
      # contents:write token -- a hijacked tag would otherwise run attacker code with push
      # access to this repo. Tag -> SHA mappings recorded above each `uses:`; verified via
      # the GitHub API at pin time (2026-08-05).

      # actions/checkout v4 (v4.4.0) -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # swift-actions/setup-swift v2 (v2.4.0) -> 7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
      # (the v2 ref is an annotated tag; this is the commit it dereferences to)
      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0"

      - name: Install ImageMagick
        # ubuntu-latest (24.04) images no longer preinstall ImageMagick -- proven by the first
        # live run failing exactly here. ~20s, cached apt lists make reruns faster.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Verify ImageMagick is present
        run: command -v magick || command -v convert

      # The state file (feed conditionals + compiled articles + rejection cache) and the
      # output directory (images survive between runs) both persist via the cache. A cache
      # miss is never fatal -- the run is just more expensive once (retained articles'
      # images re-download from their recorded source URLs).
      # actions/cache v4 (v4.3.0) -> 0057852bfaa89a56745cba8c7296529d2fc39830
      - name: Restore compiler state and output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            state/edition-state.json
            out
          key: edition-state-${{ github.run_id }}
          restore-keys: |
            edition-state-

      # actions/cache v4 (v4.3.0) -> 0057852bfaa89a56745cba8c7296529d2fc39830
      - name: Build compiler cache (SwiftPM)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Compile edition
        run: |
          mkdir -p state out
          swift run -c release compile-edition \
            --out out \
            --state state/edition-state.json \
            --base-url "$BASE_URL"

      - name: Publish to gh-pages (single force-pushed commit)
        run: |
          set -euo pipefail

          # The git metadata lives OUTSIDE out/, via GIT_DIR/GIT_WORK_TREE. Previously
          # `git init` ran inside out/ itself and the step ended with `rm -rf .git` to keep
          # the repo out of the cached `out` path -- on 2026-08-22 (run 32569673396) that rm
          # failed with "Directory not empty" and, under `set -e`, failed the whole job AFTER
          # the gh-pages push had already succeeded. The likeliest writer racing the rm is
          # git's own detached auto-gc (gc.auto defaults on at 6700 loose objects, and every
          # run commits the WHOLE out/ tree as a fresh orphan, so the threshold is reachable)
          # still repacking .git/objects while rm walked it.
          #
          # Keeping .git out of out/ entirely removes the hazard by construction rather than
          # papering over it: there is nothing inside the cached directory left to clean up,
          # so no cleanup step can fail the run.
          WORK_TREE="$(pwd)/out"
          export GIT_DIR="$RUNNER_TEMP/edition-gitdir"
          export GIT_WORK_TREE="$WORK_TREE"
          rm -rf "$GIT_DIR"

          # Pages must serve the .gz as-is; .nojekyll skips Jekyll processing entirely.
          touch "$WORK_TREE/.nojekyll"

          git init -b gh-pages
          git config user.name "broadsheet-edition-bot"
          git config user.email "actions@users.noreply.github.com"
          # Belt and braces: nothing should trigger gc in a single-commit throwaway repo, and
          # it can no longer hurt us if it does.
          git config gc.auto 0

          git add -A
          # --allow-empty: a fresh orphan init always has something to commit (.nojekyll at
          # minimum), but never let a someday-empty diff kill the job under `set -e`.
          git commit -m "edition $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty

          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

          # $RUNNER_TEMP is discarded with the VM anyway -- tidiness only, and it must never
          # be able to fail the job.
          rm -rf "$GIT_DIR" || true
